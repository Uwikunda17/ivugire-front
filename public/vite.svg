<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rwandaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20BFEF"/>
      <stop offset="45%" style="stop-color:#FAD201"/>
      <stop offset="100%" style="stop-color:#20AF4F"/>
    </linearGradient>
  </defs>

  <!-- Rounded square outline only -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40"
        fill="none" stroke="url(#rwandaGrad)" stroke-width="5"/>

  <!-- Chat bubble body outline -->
  <rect x="45" y="55" width="110" height="75" rx="16" ry="16"
        fill="none" stroke="url(#rwandaGrad)" stroke-width="4"/>

  <!-- Chat bubble tail outline -->
  <polyline points="62,130 45,155 85,130"
            fill="none" stroke="url(#rwandaGrad)" stroke-width="4"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Message dots -->
  <circle cx="75" cy="93" r="6" fill="#20BFEF"/>
  <circle cx="100" cy="93" r="6" fill="#FAD201"/>
  <circle cx="125" cy="93" r="6" fill="#20AF4F"/>
</svg>